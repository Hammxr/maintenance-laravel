[PHP]
post_max_size = 420M
upload_max_filesize = 400M
memory_limit = 1024M
expose_php = 0
realpath_cache_size = 16M
realpath_cache_ttl = 360

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.use_cwd = 0
opcache.max_file_size = 0
opcache.max_accelerated_files = 32531
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.interned_strings_buffer = 16
; file_cache disabled: it's a known crash combo with JIT (PHP bugs #79998,
; #80243, #80903, php-src #10626/#19125 — SHM lock errors / segfaults on
; file-cache refresh with JIT enabled). Octane workers are long-lived and
; stay warm in SHM opcache anyway, so file_cache adds risk with no benefit
; here. This is what was silently killing RoadRunner workers on boot.
;opcache.file_cache = /tmp/opcache-file-cache
;opcache.file_cache_only = 0
opcache.error_log = /tmp/opcache-errors.log
opcache.log_verbosity_level = 2

[JIT]
opcache.jit_buffer_size = 128M
opcache.jit = tracing
opcache.jit_hot_loop = 16
opcache.jit_hot_func = 16
opcache.jit_hot_return = 8
opcache.jit_hot_side_exit = 8

[zlib]
zlib.output_compression = On
zlib.output_compression_level = 6
